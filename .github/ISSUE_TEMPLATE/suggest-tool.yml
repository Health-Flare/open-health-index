name: Suggest a tool
description: Tell us about a free, open-source health tool that should be listed.
title: "Suggest: "
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! You don't need to fill in everything. A name and a link to the source code is enough to start.
  - type: input
    id: name
    attributes:
      label: Tool name
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Link to the source code
      description: GitHub, GitLab, Codeberg, etc.
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: helps
    attributes:
      label: What does it help people do?
      description: In your own words.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Best category
      options:
        - Symptoms, flares & patterns
        - Mood & mental health
        - Medications
        - Cycle & reproductive health
        - Diabetes
        - Your medical records
        - Body, sleep & food
        - Communication & accessibility
        - Harm reduction
        - Not sure
  - type: checkboxes
    id: platforms
    attributes:
      label: Where does it run?
      options:
        - label: Android
        - label: iPhone
        - label: Web
        - label: Desktop
        - label: Self-hosted server
  - type: checkboxes
    id: relationship
    attributes:
      label: Your relationship to the tool
      options:
        - label: I help make or maintain this tool
