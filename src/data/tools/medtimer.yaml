    source: https://github.com/Futsch1/medTimer/blob/main/fastlane/metadata/android/en-US/images/phoneScreenshots/1.png
    license: MIT
  - file: ../../assets/tools/medtimer/medicines.png
    alt: Medicine list with Omega 3, B12 and Ginseng, each showing pills left, reminder times and tags like Supplements and Energy
    source: https://github.com/Futsch1/medTimer/blob/main/fastlane/metadata/android/en-US/images/phoneScreenshots/2.png
    license: MIT
  - file: ../../assets/tools/medtimer/analysis.png
    alt: Analysis calendar for August 2025 with days that had doses highlighted, and below it the dose log for August 1 with times and amounts
    source: https://github.com/Futsch1/medTimer/blob/main/fastlane/metadata/android/en-US/images/phoneScreenshots/8.png
