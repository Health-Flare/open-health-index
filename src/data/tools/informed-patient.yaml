name: Informed Patient
summary: An AI skill that interviews you about a health question, searches medical research, and writes an evidence summary with questions for your care team.
category: symptoms
platforms: [web, desktop]
setup: easy
privacy:
  data_location: device
  account_required: false
  works_offline: true
license: CC-BY-4.0
links:
  source: https://github.com/DrCatHicks/informed-patient
reviewed_on: 2026-10-18
notes: If you use Claude, it runs inside Claude, so what you share goes to Anthropic, not to this project. You can also paste it as a prompt into other AI models, including ones on your own computer. A thinking aid, not medical advice.
